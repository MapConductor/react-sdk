name: npm publish

# Publishes every non-private workspace to npm. RN packages are all
# private: true, so they are excluded by construction.
#
# Order matters: link -> install -> build -> unlink -> assert -> preflight ->
# preview -> publish -> verify. The build must happen while internal deps are
# still linked to "*", and nothing may be published until they are restored.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest
    # Publishing itself takes ~3 min. The rest of the budget is the anonymous
    # visibility gate, which waits up to 15 min per newly-created package name
    # (already-published ones answer on the first try and cost nothing).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # cache: npm

      # Internal packages may not exist in the npm registry yet. Normalize
      # their dependency specs temporarily so npm links every dependency from
      # the checked-out workspaces instead of trying to download it.
      - name: Link local workspace packages
        run: node scripts/link-local-workspaces.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build publishable packages
        run: npm run build:packages

      # link-local-workspaces.mjs changes internal dependency specs to "*".
      # Restore them before publishing so no package ships a "*" dependency on
      # another @mapconductor package.
      #
      # This used to be `git submodule foreach 'git restore -- package.json'`,
      # which only covered submodules. react-for-mappls, react-kml and every
      # reactnative-for-* package live directly in this repo, so their "*"
      # specs survived and would have been published verbatim. None of them had
      # been published before, so it never shipped - but react-for-mappls and
      # react-kml publish for the first time in 0.2.0.
      - name: Restore package manifests for publishing
        run: node scripts/unlink-local-workspaces.mjs

      # Nothing may reach the registry depending on "*". Fail loudly rather
      # than publish an unpinned graph.
      - name: Assert no wildcard internal dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn '"@mapconductor/[a-z0-9-]*": "\*"' --include=package.json . \
               | grep -v node_modules | grep -vE '(^|\./)examples/'; then
            echo "::error::internal dependency left as \"*\" outside examples/"
            exit 1
          fi
          echo "no wildcard internal dependencies outside examples/"

      # Inspect the actual tarballs before anything is uploaded: version,
      # license, internal dep pins, and that each one really contains dist/.
      # react-for-mapkit@0.1.3 shipped with no code because it was missing from
      # build:packages, and npm published it without complaint.
      - name: Preflight publishable packages
        run: node scripts/preflight-publish.mjs

      - name: Preview npm packages
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            npm query .workspace --json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                for (const workspace of JSON.parse(input)) {
                  if (!workspace.private) console.log(workspace.name);
                }
              });
            '
          )

          for package in "${packages[@]}"; do
            echo "::group::${package}"

            # Skip previewing when the local version is already on the registry.
            local_version="$(npm pkg get version --workspace "${package}" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(input);
                const version = typeof parsed === "string" ? parsed : Object.values(parsed)[0];
                process.stdout.write(version);
              });
            ')"

            if npm view "${package}@${local_version}" version >/dev/null 2>&1; then
              echo "Skipping ${package}@${local_version}: already published."
              echo "::endgroup::"
              continue
            fi

            npm publish --workspace "${package}" --access public --dry-run
            echo "::endgroup::"
          done
        env:
          # npm checks authentication even for a publish dry run.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm packages
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            npm query .workspace --json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                for (const workspace of JSON.parse(input)) {
                  if (!workspace.private) console.log(workspace.name);
                }
              });
            '
          )

          for package in "${packages[@]}"; do
            echo "::group::${package}"

            # Skip publishing when the local version is already on the registry.
            local_version="$(npm pkg get version --workspace "${package}" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const parsed = JSON.parse(input);
                const version = typeof parsed === "string" ? parsed : Object.values(parsed)[0];
                process.stdout.write(version);
              });
            ')"

            if npm view "${package}@${local_version}" version >/dev/null 2>&1; then
              echo "Skipping ${package}@${local_version}: already published."
              echo "::endgroup::"
              continue
            fi

            npm publish --workspace "${package}" --access public
            echo "::endgroup::"
          done
        env:
          # npm checks authentication even for a publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `npm publish` printed "+ @mapconductor/react-geojson@0.2.0" and exited 0
      # for the three packages whose NAME was new (react-geojson, react-kml,
      # react-for-mappls), yet an anonymous GET of the packument returned 404
      # while the 17 packages that were only new VERSIONS were fine.
      #
      # A scoped package that ends up "restricted" is invisible to anonymous
      # requests, which is indistinguishable from "never created" unless you
      # ask with the token. So: report the authenticated visibility, force
      # public, then verify anonymously. Anonymous 404 is the only check that
      # actually proves a user can install it.
      - name: Force public access and verify anonymous visibility
        shell: bash
        run: |
          set -uo pipefail

          mapfile -t packages < <(
            npm query .workspace --json | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                for (const workspace of JSON.parse(input)) {
                  if (!workspace.private) console.log(workspace.name);
                }
              });
            '
          )

          failed=()
          for package in "${packages[@]}"; do
            # `npm access get status <pkg>` prints "<pkg>: public", not "public".
            # Comparing the whole line to "public" never matched, so every
            # package took the "force" branch and got a 403 from the access API
            # (the publish token cannot manage access). Harmless, but it buried
            # the real result in noise.
            status="$(npm access get status "${package}" 2>/dev/null | awk '{print $NF}')"
            status="${status:-unknown}"
            if [ "${status}" != "public" ]; then
              echo "${package}: access=${status}, forcing public"
              npm access set status=public "${package}" || echo "::warning::npm access set failed for ${package}"
            fi

            # Anonymous, unauthenticated read - what an installing user sees.
            # A brand-new package NAME takes minutes to appear on the read path
            # even though publish already returned success (react-geojson,
            # react-kml and react-for-mappls all 404'd for ~5 minutes in 0.2.0),
            # so retry instead of failing the release on propagation lag.
            #
            # 10 attempts (5 min) was still too short: react-for-arcgis failed
            # this gate and was readable minutes later. The gate exists to catch
            # "never created", so err toward waiting rather than crying wolf -
            # a false failure here teaches people to ignore a real one.
            code=000
            for attempt in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' \
                "https://registry.npmjs.org/$(printf '%s' "${package}" | sed 's|/|%2F|')")"
              [ "${code}" = "200" ] && break
              sleep 30
            done

            if [ "${code}" = "200" ]; then
              echo "ok   ${package} (anonymous ${code}, access=${status})"
            else
              echo "::error::${package} is not anonymously readable after retries (HTTP ${code}, access=${status})"
              failed+=("${package}")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} package(s) not publicly installable: ${failed[*]}"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
