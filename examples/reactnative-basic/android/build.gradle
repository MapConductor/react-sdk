// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // android-sdk (mavenLocal の com.mapconductor:* 1.3.1) が Kotlin 2.4 でコンパイル
    // されているため、RN 側は 2.3 系（Expo の pika-compiler が対応する最新）に上げる。Kotlin は +1 マイナーの
    // メタデータ前方互換があるため 2.3 で 2.4.0 メタデータを読める。RN 既定 (2.1.x) のままだと
    // "Module was compiled with an incompatible version of Kotlin" で落ちる。
    kotlinVersion = '2.3.20'
    // NDK は GitHub の ubuntu ランナーに入っている版に合わせる。RN 既定の 27.0.12077973 は
    // ランナーに無く、CI が毎回ダウンロードしていた（途中で通信が切れて落ちたことがある）。
    ndkVersion = '27.1.12297006'
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")

    // AGP などビルド用プラグインが引き込む古い版に既知の脆弱性がある（Dependabot）。
    // ビルド時にだけ使われアプリには入らないが、修正版へ引き上げておく。
    constraints {
      ['netty-codec', 'netty-codec-http', 'netty-codec-http2', 'netty-common', 'netty-handler', 'netty-handler-proxy'].each {
        classpath("io.netty:$it:4.1.140.Final")
      }
      classpath('org.bouncycastle:bcprov-jdk18on:1.87')
      classpath('org.bouncycastle:bcpkix-jdk18on:1.87')
      classpath('org.bouncycastle:bcutil-jdk18on:1.87')
      classpath('org.apache.commons:commons-compress:1.28.0')
      classpath('org.bitbucket.b_c:jose4j:0.9.6')
      classpath('org.jdom:jdom2:2.0.6.1')
      classpath('com.google.guava:guava:33.7.2-jre')
    }
  }
}

allprojects {
  repositories {
    mavenLocal()
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    // com.mapconductor:for-arcgis's POM depends on com.esri:arcgis-maps-kotlin-toolkit-bom,
    // published only here - reactnative-for-arcgis/android/build.gradle declares this repo too,
    // but the :app project's own dependency resolution needs it listed at this (root) level.
    maven { url 'https://esri.jfrog.io/artifactory/arcgis' }
    // com.mapconductor:for-longdo は com.longdo.map:sdk3 に依存する。ここでしか配布されていない。
    maven { url 'https://maven.longdo.com/artifactory/libs-release-public' }
    // Mapbox Maven repository（v11 は認証不要）
    maven { url 'https://api.mapbox.com/downloads/v2/releases/maven' }
    // TomTom Orbis Maps Display SDK はここでしか配られていない。
    maven { url 'https://repositories.tomtom.com/artifactory/maven' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// com.mapconductor:for-googlemaps requires minSdk 26; this Expo app's generated default is 24.
// (Pre-existing gap - reactnative-for-googlemaps ships an Expo
// config plugin that's supposed to raise this but isn't wired into this app's app.config.ts.)
ext.minSdkVersion = 26
